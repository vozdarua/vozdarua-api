# Test configuration for Cloudflare R2
%test.cloudflare.r2.bucket-name=test-bucket
%test.cloudflare.r2.public-url=https://test.r2.dev/
%test.cloudflare.r2.folder-name=test-folder/

# Dummy static credentials so the S3/R2 client bean can initialize at boot.
# No test exercises the image-upload endpoint (IssueResource#uploadToR2), so
# these values are never used for a real request.
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.quarkus.s3.endpoint-override=http://localhost:1

# Disable JDBC security for tests - only use TestSecurity annotations
%test.quarkus.security.jdbc.enabled=false
