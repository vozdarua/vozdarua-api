############### GLOBAL ##################################

quarkus.http.port=${PORT:8080}

#Default locale for the application and supported locales
quarkus.default-locale=pt_BR
quarkus.locales=en,pt-BR,pt

# CONFIGURAÇÃO GERAL (Valida para todos os ambientes)
mp.jwt.verify.issuer=https://vozdarua.com.br

# URL pública do frontend, usada para montar o link de reset de senha no e-mail.
# Default cobre dev/test (localhost); em prod é sobrescrita pela env var FRONTEND_URL.
app.frontend-url=http://localhost:3000

############### DEV ##################################

# Força o Dev Services a gerar chaves automaticamente na sua máquina
%dev.quarkus.jwt.sign.key.generator.forced=true

# Configure the Reactive Postgres driver (default for new Quarkus apps)
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=root
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/vozdarua_db

# Database generation strategy (updates schema automatically)
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Import initial data
%dev.quarkus.hibernate-orm.sql-load-script=dev_import.sql

# Cloudflare R2 Credentials
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${R2_ACCESS_KEY_ID}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${R2_SECRET_ACCESS_KEY}

# Cloudflare R2 specific Endpoint Configuration
# Replace <ACCOUNT_ID> with your actual Cloudflare Account ID string
%dev.quarkus.s3.endpoint-override=https://0fe6eca73e71c37221c2250c699c3829.r2.cloudflarestorage.com

# R2 auto-aliases regions, but the underlying AWS SDK demands a valid input string
%dev.quarkus.s3.aws.region=us-east-1

# Target R2 Bucket Name
%dev.cloudflare.r2.bucket-name=fizcalizai-test
%dev.cloudflare.r2.public-url=https://pub-3f4709c3ed3d40c1b2998279f08c23a4.r2.dev/
%dev.cloudflare.r2.folder-name=test-uploads/

### Mail ###

%dev.quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
%dev.quarkus.mailer.from=pedrospsjc@gmail.com
%dev.quarkus.mailer.host=smtp.gmail.com
%dev.quarkus.mailer.port=587
%dev.quarkus.mailer.start-tls=REQUIRED
%dev.quarkus.mailer.username=pedrospsjc@gmail.com
%dev.quarkus.mailer.password=${GMAIL_APP_PASS}

%dev.quarkus.mailer.mock=false # In dev mode, prevent from using the mock SMTP server

############### TEST ##################################

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=postgres
%test.quarkus.datasource.password=secret
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/vozdarua_db

# Database generation strategy for tests
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Import initial data in tests
%test.quarkus.hibernate-orm.sql-load-script=import.sql

############### PROD ##################################

#%prod.quarkus.http.insecure-requests=redirect
#%prod.quarkus.ssl.native=true

%prod.smallrye.jwt.sign.key=${QUARKUS_JWT_KEY}
%prod.mp.jwt.verify.publickey=${QUARKUS_JWT_PUBLIC_KEY}

%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=*
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%prod.quarkus.http.cors.headers=accept,authorization,content-type


# 1. Choose the production profile
%prod.quarkus.datasource.db-kind=postgresql

# 2. Database connection credentials (using Environment Variables)
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# 3. Database URL (Reactive vs JDBC)
# If using the Reactive SQL Client:
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require

# 4. Database schema management (updates schema automatically in production if desired)
%prod.quarkus.hibernate-orm.schema-management.strategy=create

# Import initial data
%prod.quarkus.hibernate-orm.sql-load-script=import.sql

# 5. Enable Swagger UI and OpenAPI in production
%prod.quarkus.smallrye-health.ui.always-include=true
%prod.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.path=/swagger-ui

# Cloudflare R2 Credentials
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${R2_ACCESS_KEY_ID}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${R2_SECRET_ACCESS_KEY}

# Cloudflare R2 specific Endpoint Configuration
%prod.quarkus.s3.endpoint-override=https://0fe6eca73e71c37221c2250c699c3829.r2.cloudflarestorage.com

# R2 auto-aliases regions, but the underlying AWS SDK demands a valid input string
%prod.quarkus.s3.aws.region=us-east-1

# Target R2 Bucket Name
%prod.cloudflare.r2.bucket-name=fizcalizai-test
%prod.cloudflare.r2.public-url=https://pub-3f4709c3ed3d40c1b2998279f08c23a4.r2.dev/
%prod.cloudflare.r2.folder-name=test-uploads/

### Mail ###

%prod.quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
%prod.quarkus.mailer.from=pedrospsjc@gmail.com
%prod.quarkus.mailer.host=smtp.gmail.com
%prod.quarkus.mailer.port=587
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=pedrospsjc@gmail.com
%prod.quarkus.mailer.password=${GMAIL_APP_PASS}

# URL pública do frontend, usada para montar o link de reset de senha no e-mail
%prod.app.frontend-url=${FRONTEND_URL}