############### GLOBAL ##################################

quarkus.http.port=${PORT:8080}
# Limite de tamanho de corpo de requisição (cobre o upload de foto em /issues/image/upload)
quarkus.http.limits.max-body-size=10M

#Default locale for the application and supported locales
quarkus.default-locale=pt_BR
quarkus.locales=en,pt-BR,pt

# CONFIGURAÇÃO GERAL (Valida para todos os ambientes)
mp.jwt.verify.issuer=https://vozdarua.com.br

# URL pública do frontend, usada para montar o link de reset de senha no e-mail.
# Default cobre dev/test (localhost); em prod é sobrescrita pela env var FRONTEND_URL.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Cloudflare R2 Credentials
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${R2_ACCESS_KEY_ID}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${R2_SECRET_ACCESS_KEY}

# Cloudflare R2 specific Endpoint Configuration
quarkus.s3.endpoint-override=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

# R2 auto-aliases regions, but the underlying AWS SDK demands a valid input string
quarkus.s3.aws.region=us-east-1

# Target R2 Bucket Name
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}
cloudflare.r2.public-url=https://pub-1159b2f30f2e40949b30a311a0e6990b.r2.dev/
cloudflare.r2.folder-name=${R2_FOLDER_NAME}

resend.email.token=${RESEND_TOKEN}
resend.email.from=contato@vozdarua.treq.com.br
resend.email.vozdarua=vozdarua.app@gmail.com

geoapify.api-key=${GEOAPIFY_API_KEY}

############### DEV ##################################

# Força o Dev Services a gerar chaves automaticamente na sua máquina
%dev.quarkus.jwt.sign.key.generator.forced=true

# Configure the Reactive Postgres driver (default for new Quarkus apps)
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=root
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/vozdarua_db

# Schema é gerenciado por Flyway (src/main/resources/db/migration) — Hibernate só valida.
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.clean-at-start=false

############### TEST ##################################

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=postgres
%test.quarkus.datasource.password=secret
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/vozdarua_db_test

# Schema é gerenciado por Flyway — Hibernate só valida. Isolamento entre testes continua
# via @BeforeEach deleteAll() nos resources de teste, não via flyway clean.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.flyway.migrate-at-start=true

############### PROD ##################################

#%prod.quarkus.http.insecure-requests=redirect
#%prod.quarkus.ssl.native=true

%prod.smallrye.jwt.sign.key=${QUARKUS_JWT_KEY}
%prod.mp.jwt.verify.publickey=${QUARKUS_JWT_PUBLIC_KEY}

%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=https://vozdarua-frontend-staging.vozdarua-app.workers.dev
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%prod.quarkus.http.cors.headers=accept,authorization,content-type,x-anon-id

# DATABASE
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true

# 5. Enable Swagger UI and OpenAPI in production
%prod.quarkus.smallrye-health.ui.always-include=true
%prod.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.path=/swagger-ui

# URL pública do frontend, usada para montar o link de reset de senha no e-mail
%prod.app.frontend-url=${FRONTEND_URL}