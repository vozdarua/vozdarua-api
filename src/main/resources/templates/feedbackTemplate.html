<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Contato</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f0fdfa; font-family: 'Inter', Arial, sans-serif; color: #333333;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f0fdfa; padding: 32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(15,118,110,0.12);">
                <!-- Cabeçalho -->
                <tr>
                    <td style="background-color: #0f766e; padding: 28px 30px; text-align: center; color: #ffffff; font-size: 20px; font-weight: 800;">
                        📬 Nova Mensagem de Contato
                    </td>
                </tr>
                <!-- Conteúdo -->
                <tr>
                    <td style="padding: 32px 30px;">
                        <p style="margin-top: 0; font-size: 15px; color: #555555;">Você recebeu uma nova mensagem através do site:</p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="font-size: 15px; line-height: 1.6; margin-top: 8px;">
                            <tr>
                                <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; width: 130px; font-weight: 700; color: #0f766e;">👤 Nome</td>
                                <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; color: #333333;">{name}</td>
                            </tr>
                            <tr>
                                <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; font-weight: 700; color: #0f766e;">📧 E-mail</td>
                                <td style="padding: 10px 0; border-bottom: 1px solid #eeeeee; color: #333333;"><a href="mailto:{email}" style="color: #0d9488; text-decoration: none; font-weight: 600;">{email}</a></td>
                            </tr>
                            <tr>
                                <td style="padding: 10px 0; font-weight: 700; color: #0f766e;">🏷️ Tipo</td>
                                <td style="padding: 10px 0; color: #333333;">{type}</td>
                            </tr>
                        </table>

                        <div style="margin-top: 24px;">
                            <strong style="display: block; margin-bottom: 10px; color: #0f766e; font-size: 14px;">💬 Mensagem</strong>
                            <div style="background-color: #f0fdfa; border-left: 4px solid #0d9488; padding: 16px; border-radius: 6px; color: #333333; font-style: italic; line-height: 1.6;">
                                {message}
                            </div>
                        </div>
                    </td>
                </tr>
                <!-- Rodapé -->
                <tr>
                    <td style="background-color: #f0fdfa; padding: 18px; text-align: center; font-size: 12px; color: #6b8280;">
                        Voz da Rua · Este é um e-mail automático enviado pelo sistema de contato.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
