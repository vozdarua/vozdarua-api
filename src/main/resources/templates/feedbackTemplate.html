<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Contato</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: Arial, sans-serif; color: #333333;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f4f7; padding: 20px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <!-- Cabeçalho -->
                <tr>
                    <td style="background-color: #007bff; padding: 20px; text-align: center; color: #ffffff; font-size: 20px; font-weight: bold;">
                        Nova Mensagem de Contato
                    </td>
                </tr>
                <!-- Conteúdo -->
                <tr>
                    <td style="padding: 30px;">
                        <p style="margin-top: 0; font-size: 16px; color: #555555;">Você recebeu uma nova mensagem através do site:</p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="font-size: 15px; line-height: 1.6;">
                            <tr>
                                <td style="padding: 8px 0; border-bottom: 1px solid #eeeeee; width: 100px; font-weight: bold; color: #333333;">Nome:</td>
                                <td style="padding: 8px 0; border-bottom: 1px solid #eeeeee; color: #555555;">{name}</td>
                            </tr>
                            <tr>
                                <td style="padding: 8px 0; border-bottom: 1px solid #eeeeee; font-weight: bold; color: #333333;">E-mail:</td>
                                <td style="padding: 8px 0; border-bottom: 1px solid #eeeeee; color: #555555;"><a href="{email}" style="color: #007bff; text-decoration: none;">{email}</a></td>
                            </tr>
                            <tr>
                                <td style="padding: 8px 0; border-bottom: 1px solid #eeeeee; font-weight: bold; color: #333333;">Tipo:</td>
                                <td style="padding: 8px 0; border-bottom: 1px solid #eeeeee; color: #555555;">{type}</td>
                            </tr>
                        </table>

                        <div style="margin-top: 20px;">
                            <strong style="display: block; margin-bottom: 8px; color: #333333;">Mensagem:</strong>
                            <div style="background-color: #f9f9f9; border-left: 4px solid #007bff; padding: 15px; border-radius: 4px; color: #55555; font-style: italic;">
                                {message}
                            </div>
                        </div>
                    </td>
                </tr>
                <!-- Rodapé -->
                <tr>
                    <td style="background-color: #f4f4f7; padding: 15px; text-align: center; font-size: 12px; color: #888888;">
                        Este é um e-mail automático enviado pelo sistema de contato.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
