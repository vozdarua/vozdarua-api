<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{subject}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f0fdfa; font-family: 'Inter', Arial, sans-serif; color: #333333;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f0fdfa; padding: 32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(15,118,110,0.12);">
                <!-- Cabeçalho -->
                <tr>
                    <td style="background-color: #0f766e; padding: 28px 30px; text-align: center; color: #ffffff; font-size: 20px; font-weight: 800;">
                        🔒 {subject}
                    </td>
                </tr>
                <!-- Conteúdo -->
                <tr>
                    <td style="padding: 32px 30px; text-align: center;">
                        <p style="margin-top: 0; font-size: 15px; color: #555555; line-height: 1.6;">{greeting}</p>

                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 28px auto;">
                            <tr>
                                <td style="border-radius: 8px; background-color: #0d9488;">
                                    <a href="{url}" style="display: inline-block; padding: 14px 32px; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 8px;">
                                        🔑 {buttonLabel}
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <p style="font-size: 13px; color: #6b8280; line-height: 1.6;">
                            Ou copie e cole este link no seu navegador:<br>
                            <a href="{url}" style="color: #0d9488; word-break: break-all;">{url}</a>
                        </p>

                        <div style="margin-top: 24px; background-color: #f0fdfa; border-left: 4px solid #0d9488; padding: 14px 16px; border-radius: 6px; text-align: left;">
                            <p style="margin: 0; font-size: 13px; color: #333333;">⏳ {expiryNote}</p>
                        </div>

                        <p style="margin-top: 20px; font-size: 12px; color: #999999; line-height: 1.6;">
                            🛡️ {ignoreNote}
                        </p>
                    </td>
                </tr>
                <!-- Rodapé -->
                <tr>
                    <td style="background-color: #f0fdfa; padding: 18px; text-align: center; font-size: 12px; color: #6b8280;">
                        Voz da Rua · Este é um e-mail automático, não responda.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
